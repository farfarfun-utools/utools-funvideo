<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19332d">
  <title>视频工坊</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="workshop.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3V7Z"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></symbol>
    <symbol id="icon-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></symbol>
    <symbol id="icon-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="m8.1 8.1 11.8 11.8M14 10l6-6M8.1 15.9 11 13"/></symbol>
    <symbol id="icon-scale" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 5h3a2 2 0 0 0 2-2v-3M8 12h8"/></symbol>
    <symbol id="icon-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="icon-audio" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9M19 13v6H5V5h6"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand"><img src="logo.svg" alt="" width="38" height="38"><div><h1>视频工坊</h1><span>FunVideo</span></div></div>
      <div class="top-actions">
        <button id="add-files" class="button secondary" type="button" data-lock><svg><use href="#icon-plus"/></svg>添加视频</button>
      </div>
      <button id="open-settings" class="icon-button" type="button" title="设置" aria-label="设置" aria-haspopup="dialog" aria-controls="settings-dialog" data-lock><svg><use href="#icon-settings"/></svg></button>
    </header>

    <main class="workspace">
      <nav class="toolnav" aria-label="处理工具">
        <div id="category-rail" class="category-rail" aria-label="工具分类"></div>
        <div class="tool-panel"><span class="tool-caption">选择工具</span><div id="tool-list" class="tool-list"></div></div>
        <select id="operation" aria-label="处理方式" data-lock hidden>
          <optgroup label="优化与格式"><option value="compress">视频压缩</option><option value="convert">格式转换</option><option value="resize">调整尺寸</option><option value="speed">视频变速</option></optgroup>
          <optgroup label="画面编辑"><option value="trim">时长裁剪</option><option value="crop">画面裁剪</option><option value="transform">旋转翻转</option><option value="watermark">添加水印</option></optgroup>
          <optgroup label="提取与导出"><option value="animate">转为动图</option><option value="cover">提取封面</option><option value="frames">批量抽帧</option></optgroup>
          <optgroup label="音频"><option value="audio">音频处理</option></optgroup>
        </select>
      </nav>
      <aside class="settings" aria-label="处理参数">
        <div class="settings-heading"><h2>压缩参数</h2><span id="operation-description">批量压缩视频</span></div>
        <fieldset id="options" class="options">
          <div class="option-group" data-for="compress">
            <label for="quality">压缩质量</label>
            <select id="quality"><option value="balanced">均衡</option><option value="small">更小文件</option><option value="high">更清晰</option></select>
            <p>输出 MP4，保留视频与首条音轨。</p>
          </div>
          <div class="option-group" data-for="trim" hidden>
            <label for="trim-start">开始时间 · 秒</label>
            <input id="trim-start" type="number" min="0" step="0.1" value="0" inputmode="decimal">
            <label for="trim-end">结束时间 · 秒</label>
            <input id="trim-end" type="number" min="0" step="0.1" placeholder="留空表示到视频结尾" inputmode="decimal">
            <p>对队列中每个视频使用同一时间范围。</p>
          </div>
          <div class="option-group" data-for="resize" hidden>
            <label for="width">输出宽度 · 像素</label>
            <input id="width" type="number" min="160" max="7680" step="2" value="1280" inputmode="numeric">
            <p>高度按原画面比例调整为偶数。</p>
          </div>
          <div class="option-group" data-for="convert" hidden>
            <label for="format">输出格式</label>
            <select id="format"><option value="mp4">MP4 · H.264 / AAC</option><option value="mkv">MKV · H.264 / AAC</option><option value="webm">WebM · VP9 / Opus</option></select>
          </div>
          <div class="option-group" data-for="animate" hidden>
            <label for="gif-duration">动图时长 · 秒</label>
            <input id="gif-duration" type="number" min="1" max="30" step="0.1" value="5" inputmode="decimal">
            <label for="gif-width">输出宽度 · 像素</label>
            <select id="gif-width"><option value="320">320</option><option value="480" selected>480</option><option value="720">720</option></select>
            <label for="gif-fps">帧率</label>
            <select id="gif-fps"><option value="10">10 fps</option><option value="15" selected>15 fps</option><option value="24">24 fps</option></select>
          </div>
          <div class="option-group" data-for="transform" hidden>
            <label for="direction">方向</label>
            <select id="direction"><option value="clockwise">顺时针 90°</option><option value="counterclockwise">逆时针 90°</option><option value="rotate180">旋转 180°</option><option value="hflip">水平翻转</option><option value="vflip">垂直翻转</option></select>
          </div>
          <div class="option-group" data-for="audio" hidden>
            <label for="audio-mode">操作</label>
            <select id="audio-mode"><option value="extract">提取音频 · M4A</option><option value="mute">移除声音 · MP4</option><option value="gain">调整音量 · MP4</option></select>
            <div id="gain-setting" class="nested-option" hidden><label for="audio-level">音量倍数</label><input id="audio-level" type="number" min="0.25" max="4" step="0.05" value="1.5" inputmode="decimal"></div>
          </div>
          <div class="option-group" data-for="crop" hidden><label for="crop-x">起点 X · 像素</label><input id="crop-x" type="number" min="0" step="2" value="0"><label for="crop-y">起点 Y · 像素</label><input id="crop-y" type="number" min="0" step="2" value="0"><label for="crop-width">裁剪宽度 · 像素</label><input id="crop-width" type="number" min="2" step="2" value="1280"><label for="crop-height">裁剪高度 · 像素</label><input id="crop-height" type="number" min="2" step="2" value="720"></div>
          <div class="option-group" data-for="watermark" hidden><label>水印图片</label><div id="watermark-file" class="file-label">尚未选择</div><button id="choose-watermark" class="button secondary" type="button">选择图片</button><label for="watermark-width">水印宽度 · 像素</label><input id="watermark-width" type="number" min="16" max="2000" value="180"><label for="watermark-opacity">不透明度</label><input id="watermark-opacity" type="range" min="10" max="100" value="80"><label for="watermark-position">位置</label><select id="watermark-position"><option value="bottom-right">右下</option><option value="bottom-left">左下</option><option value="top-right">右上</option><option value="top-left">左上</option><option value="center">居中</option></select></div>
          <div class="option-group" data-for="cover" hidden><label for="cover-time">封面时间 · 秒</label><input id="cover-time" type="number" min="0" step="0.1" value="0"></div>
          <div class="option-group" data-for="speed" hidden><label for="speed-rate">播放速度</label><select id="speed-rate"><option value="0.5">0.5 倍</option><option value="0.75">0.75 倍</option><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option></select></div>
          <div class="option-group" data-for="frames" hidden><label for="frame-interval">抽帧间隔 · 秒</label><input id="frame-interval" type="number" min="0.1" max="3600" step="0.1" value="5"><label for="frame-count">最多抽取 · 张</label><input id="frame-count" type="number" min="1" max="100" value="20"></div>
        </fieldset>

      </aside>

      <section class="queue" aria-labelledby="queue-title">
        <div class="queue-head"><div><h2 id="queue-title">文件队列 <span id="file-count">0</span></h2><p id="queue-summary">等待添加视频</p></div><div class="queue-actions"><button id="open-batch-folder" class="text-button" type="button" hidden>打开结果文件夹</button><button id="clear-done" class="text-button" type="button" data-lock hidden>清除已完成</button></div></div>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
        <div id="empty-state" class="empty-state"><svg><use href="#icon-film"/></svg><strong>还没有视频</strong><button id="add-empty" class="button secondary" type="button"><svg><use href="#icon-plus"/></svg>添加视频</button></div>
        <ul id="job-list" class="job-list" aria-label="待处理视频"></ul>
      </section>
      <footer class="runbar"><div class="destination"><svg><use href="#icon-folder"/></svg><span id="footer-output">首个视频所在目录</span></div><div class="run-actions"><button id="start" class="button primary" type="button" data-lock disabled><svg><use href="#icon-play"/></svg>开始处理</button><button id="cancel" class="button danger" type="button" hidden><svg><use href="#icon-stop"/></svg>取消</button></div></footer>
    </main>
  </div>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-head"><h2 id="settings-title">设置</h2><button id="close-settings" class="icon-button" type="button" title="关闭" aria-label="关闭"><svg><use href="#icon-close"/></svg></button></div>
    <div class="dialog-content">
      <div class="dialog-label">输出位置</div>
      <div id="output-label" class="output-path" title="首个视频所在目录">首个视频所在目录</div>
      <p class="output-note">每次处理会在此位置新建按日期命名的文件夹。</p>
      <div class="dialog-actions"><button id="reset-output" class="button secondary" type="button">恢复默认</button><button id="choose-output" class="button primary" type="button"><svg><use href="#icon-folder"/></svg>选择文件夹</button></div>
    </div>
  </dialog>
</body>
</html>
