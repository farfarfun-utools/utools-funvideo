name: Screenshots
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'utools/**', 'build.sh', 'package.json', 'package-lock.json', 'vite.config.mjs', '.github/workflows/screenshots.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screenshots
  cancel-in-progress: false
jobs:
  screenshots:
    uses: farfarfun-utools/.github/.github/workflows/screenshots.yml@master
    with:
      branch: main
      static: true
