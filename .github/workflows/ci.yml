name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and run tests
        run: npm run check
      - name: Check FFmpeg processing
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npm run test:ffmpeg
      - name: Check plugin resources
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const plugin = JSON.parse(fs.readFileSync('utools/plugin.json', 'utf8'))
          if (plugin.version !== require('./package.json').version) throw new Error('Version mismatch')
          for (const name of [plugin.main, plugin.preload, plugin.logo, 'app.js', 'style.css', 'tasks.js']) {
            if (!fs.statSync(path.join('utools', name)).isFile()) throw new Error(`Missing ${name}`)
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: utools-funvideo-developer-files
          path: utools/
          if-no-files-found: error
      - name: Check packaging identity
        if: github.event_name != 'pull_request'
        id: package
        env:
          UTOOLS_MID: ${{ secrets.UTOOLS_MID }}
          UTOOLS_UID: ${{ secrets.UTOOLS_UID }}
          UTOOLS_CELLPHONE: ${{ secrets.UTOOLS_CELLPHONE }}
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const identity = JSON.parse(fs.readFileSync('identity.json', 'utf8'))
          if (identity.pluginId && ['UTOOLS_MID', 'UTOOLS_UID', 'UTOOLS_CELLPHONE'].every(key => process.env[key])) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=true\n')
          } else {
            console.log('::notice::UPXS packaging awaits the official plugin ID and organization secrets.')
          }
          JS
      - name: Package UPXS
        if: steps.package.outputs.enabled == 'true'
        uses: farfarfun-action/utools-devtools@c48e8ce06b6700d21c73917b3b16d6e5674c13ef # v0.1.4
        with:
          source: utools
          output: release/utools-funvideo.upxs
          identity-file: identity.json
          mid: ${{ secrets.UTOOLS_MID }}
          uid: ${{ secrets.UTOOLS_UID }}
          cellphone: ${{ secrets.UTOOLS_CELLPHONE }}
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.enabled == 'true'
        with:
          name: utools-funvideo-upxs
          path: release/utools-funvideo.upxs
          if-no-files-found: error
